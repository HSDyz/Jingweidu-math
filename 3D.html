<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tech Factory Layout Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030613; font-family: 'Consolas', 'Courier New', monospace; transition: background-color 0.5s ease; }
        canvas { display: block; outline: none; }
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #030613; z-index: 9999; display: flex; justify-content: center; align-items: center; text-align: center;
            color: #00ffff; font-family: 'Consolas', monospace; font-size: 24px; letter-spacing: 2px;
            transition: opacity 0.8s ease;
        }

        #tooltip {
            position: absolute; top: 20px; left: 20px; background: rgba(4, 15, 30, 0.85); color: #00ffff;
            padding: 10px 15px; border: 1px solid #00ffff; border-left: 4px solid #00ffff;
            font-size: 14px; font-weight: bold; pointer-events: none; display: none; z-index: 100;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2); text-transform: uppercase; letter-spacing: 1px; backdrop-filter: blur(4px);
        }
        #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        .box-label {
            position: absolute; transform: translate(-50%, -50%); color: #00ffff;
            background: rgba(4, 15, 30, 0.85); border: 1px solid #00ffff; padding: 2px 6px;
            font-size: 11px; font-family: 'Consolas', monospace; display: none; white-space: nowrap; box-shadow: 0 0 5px rgba(0,255,255,0.3);
        }
        #labels-toggle { position: absolute; top: 60px; right: 120px; }

        .cyber-btn {
            background: rgba(4, 15, 30, 0.6); color: #00ffff; border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 8px 15px; font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease;
            backdrop-filter: blur(4px); z-index: 100; min-width: 160px; text-align: center;
        }
        .cyber-btn:hover { background: rgba(0, 255, 255, 0.15); border-color: #00ffff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); color: #fff; }

        #mode-toggle { position: absolute; top: 20px; right: 120px; }
        #reset-btn { position: absolute; bottom: 30px; left: 30px; border-left: 3px solid #ff0055; }

        #passage-legend {
            position: absolute; bottom: 30px; right: 20px; z-index: 100;
            background: rgba(4,15,30,0.82); border: 1px solid #00ff88;
            padding: 8px 14px; color: #00ff88; font-size: 12px;
            font-family: 'Consolas', monospace; letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0,255,136,0.25);
        }
        #passage-legend span { display: inline-block; width: 14px; height: 14px;
            background: #00ff88; border: 1px solid #ffff00; vertical-align: middle; margin-right: 6px; }
        
        #compass-container {
            position: absolute; top: 20px; right: 20px; width: 80px; height: 80px; pointer-events: none; z-index: 10; transform-origin: center center;
        }
        #compass-container svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0px 0px 3px rgba(0,255,255,0.4)); }
        .compass-circle { fill: rgba(4,15,30,0.5); stroke: #00ffff; stroke-width: 1; stroke-dasharray: 3 2; }
        .compass-text { font-family: 'Consolas', monospace; font-weight: bold; font-size: 14px; fill: #00ffff; text-anchor: middle; dominant-baseline: middle;}
        .compass-arrow-n { fill: #ff0055; }
        .compass-arrow { fill: #00ffff; }

        body.light-mode { background-color: #f2f5f9; }
        body.light-mode .cyber-btn { background: rgba(255, 255, 255, 0.9); color: #005577; border-color: #33bbff; }
        body.light-mode .cyber-btn:hover { background: #e6f3ff; box-shadow: 0 0 10px rgba(51, 187, 255, 0.4); }
        body.light-mode #tooltip { background: rgba(255, 255, 255, 0.95); color: #004466; border-color: #33bbff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        body.light-mode .compass-circle { fill: rgba(255,255,255,0.8); stroke: #33bbff; }
        body.light-mode .compass-text { fill: #005577; }
        body.light-mode .compass-arrow { fill: #33bbff; }
        body.light-mode #passage-legend { background: rgba(240,255,248,0.95); color: #007744; border-color: #00cc66; }
    </style>
    <!-- 全局错误捕获器 -->
    <script>
        window.addEventListener('error', function(event) {
            var ls = document.getElementById('loading-screen');
            if(ls) {
                ls.style.backgroundColor = 'rgba(50, 0, 0, 0.9)';
                ls.style.color = '#ff4444';
                ls.style.fontSize = '16px';
                ls.innerHTML = 'FATAL ERROR (代码崩溃):<br><br>' + event.message + 
                               '<br><br>如果是 "THREE is not defined"，说明您的网络屏蔽了外部插件。';
            }
        });
    </script>
</head>
<body>
    <div id="tooltip">REGION</div>
    <div id="labels-container"></div>
    
    <button id="mode-toggle" class="cyber-btn">[TOGGLE MODE]</button>
    <button id="labels-toggle" class="cyber-btn">[TOGGLE LABELS]</button>
    <button id="reset-btn" class="cyber-btn">[RESET VIEW]</button>
    <div id="passage-legend"><span></span>SAFE PASSAGE</div>

    <div id="compass-container">
        <svg viewBox="-50 -50 100 100">
            <circle class="compass-circle" cx="0" cy="0" r="42"/>
            <circle cx="0" cy="0" r="8" fill="none" stroke="currentColor" stroke-width="1" style="stroke-opacity: 0.5;"/>
            <polygon class="compass-arrow-n" points="4,-4 0,0 -4,4 0,-25" />
            <text x="0" y="-35" class="compass-text" style="fill: #ff0055;">N</text>
            <polygon class="compass-arrow" points="-4,-4 0,0 4,4 0,25" />
            <text x="0" y="35" class="compass-text">S</text>
            <polygon class="compass-arrow" points="-4,4 0,0 4,-4 25,0" />
            <text x="35" y="0" class="compass-text">E</text>
            <polygon class="compass-arrow" points="4,4 0,0 -4,-4 -25,0" />
            <text x="-35" y="0" class="compass-text">W</text>
        </svg>
    </div>

    <!-- 替换为国内更稳定的 unpkg.com CDN -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ==========================================
        // 1. 基础配置
        // ==========================================
        let isDayMode = false;
        const initialCameraPos = new THREE.Vector3(0, 25, 20);
        const initialTargetPos = new THREE.Vector3(0, 0, 0);
        const dpr = Math.min(window.devicePixelRatio, 1.5);
        
        const colors = {
            night: { bg: 0x030613, fog: 0x050a15, floor: 0x060d1a, grid: 0x00ffff, gridOpacity: 0.12, bgHex: '#030613', floorOpacity: 0.85 },
            day:   { bg: 0xf2f5f9, fog: 0xeef1f5, floor: 0xe8eef5, grid: 0x33bbff, gridOpacity: 0.20, bgHex: '#f2f5f9', floorOpacity: 0.90 }
        };
        const STATUS_COLORS = { 'red': 0xff0033, 'yellow': 0xffcc00, 'green': 0x00ff66 };

        function hexToRGB(hex) {
            const c = hex.replace('#', '').padEnd(6, '0');
            return new THREE.Vector3( parseInt(c.slice(0, 2), 16)/255, parseInt(c.slice(2, 4), 16)/255, parseInt(c.slice(4, 6), 16)/255 );
        }

        const transitionTargets = {
            ambient: 1.1, hemi: 0.7, dir: 0.5, fill: 0.2, bloom: 0.7,
            fogColor: new THREE.Color(colors.night.fog),
            floorColor: new THREE.Color(colors.night.floor),
            gridColor: new THREE.Color(colors.night.grid)
        };

        // ==========================================
        // 2. 场景初始化
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = null; 
        scene.fog = new THREE.FogExp2(colors.night.fog, 0.008);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(initialCameraPos);

        // 【致命修复 1：必须开启 stencil: true，才能支持多边形融合计算】
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: true, stencil: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(dpr);
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 3. 动态背景 Shader
        // ==========================================
        const bgScene = new THREE.Scene();
        const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        bgCamera.position.z = 1;

        const bgConfig = {
            colors: ['#00ffff', '#33bbff', '#bc13fe'],  
            dayColors: ['#0066ff', '#8800ff', '#00ccaa'], 
            speed: 0.2, streakCount: 4, streakWidth: 1.0, streakLength: 1.5, 
            glow: 0.5, density: 0.4, twinkle: 0.8, zoom: 2.0, backgroundGlow: 0.3, opacity: 1.0,
            mouseStrength: 0.5, mouseRadius: 0.5
        };

        const bgUniforms = {
            iResolution: { value: new THREE.Vector3(window.innerWidth * dpr, window.innerHeight * dpr, 1) },
            iMouse: { value: new THREE.Vector2(0, 0) },
            iTime: { value: 0 },
            uIsDay: { value: 0.0 }, 
            uColor0: { value: hexToRGB(bgConfig.colors[0]) },
            uColor1: { value: hexToRGB(bgConfig.colors[1]) },
            uColor2: { value: hexToRGB(bgConfig.colors[2]) },
            uColorCount: { value: 3 },
            uBgColor: { value: hexToRGB(colors.night.bgHex) },
            uMouseColor: { value: hexToRGB('#00ffff') },
            uSpeed: { value: bgConfig.speed },
            uStreakCount: { value: bgConfig.streakCount },
            uStreakWidth: { value: bgConfig.streakWidth },
            uStreakLength: { value: bgConfig.streakLength },
            uGlow: { value: bgConfig.glow },
            uDensity: { value: bgConfig.density },
            uTwinkle: { value: bgConfig.twinkle },
            uZoom: { value: bgConfig.zoom },
            uBgGlow: { value: bgConfig.backgroundGlow },
            uOpacity: { value: bgConfig.opacity },
            uMouseEnabled: { value: 1.0 },
            uMouseStrength: { value: bgConfig.mouseStrength },
            uMouseRadius: { value: bgConfig.mouseRadius }
        };

        const bgMaterial = new THREE.ShaderMaterial({
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
            fragmentShader: `
                precision highp float;
                uniform vec3 iResolution; uniform vec2 iMouse; uniform float iTime;
                uniform float uIsDay; uniform vec3 uColor0; uniform vec3 uColor1; uniform vec3 uColor2;
                uniform vec3 uBgColor; uniform vec3 uMouseColor;
                uniform float uSpeed; uniform int uStreakCount; uniform float uStreakWidth; uniform float uStreakLength;
                uniform float uGlow; uniform float uDensity; uniform float uTwinkle; uniform float uZoom;
                uniform float uBgGlow; uniform float uOpacity; uniform float uMouseEnabled; uniform float uMouseStrength; uniform float uMouseRadius;
                varying vec2 vUv;
                vec3 palette(float h) {
                    int idx = int(floor(clamp(h, 0.0, 0.999999) * 3.0));
                    if (idx == 0) return uColor0; if (idx == 1) return uColor1; return uColor2;
                }
                vec3 tanhv(vec3 x) { vec3 e = exp(-2.0 * x); return (1.0 - e) / (1.0 + e); }
                vec2 sceneC(vec2 frag, vec2 r) {
                    vec2 P = (frag + frag - r) / r.x; float z = 0.0; float d = 1e3; vec4 O = vec4(0.0);
                    for (int k = 0; k < 39; k++) {
                        if (d <= 1e-4) break;
                        O = z * normalize(vec4(P, uZoom, 0.0)) - vec4(0.0, 4.0, 1.0, 0.0) / 4.5;
                        d = 1.0 - sqrt(length(O * O)); z += d;
                    }
                    return vec2(O.x, atan(O.z, O.y));
                }
                void mainImage(out vec4 o, vec2 C) {
                    vec2 r = iResolution.xy; vec2 uv0 = (C + C - r) / r.x;
                    float T = 0.1 * iTime * uSpeed + 9.0;
                    float angRings = max(1.0, floor(6.28318530718 * max(uDensity, 0.05) + 0.5));
                    vec2 Y = vec2(5e-3, 6.28318530718 / angRings);
                    vec2 c0 = sceneC(C, r); vec2 cdx = sceneC(C + vec2(1.0, 0.0), r); vec2 cdy = sceneC(C + vec2(0.0, 1.0), r);
                    vec2 dCx = cdx - c0; vec2 dCy = cdy - c0;
                    dCx.y -= 6.28318530718 * floor(dCx.y / 6.28318530718 + 0.5); dCy.y -= 6.28318530718 * floor(dCy.y / 6.28318530718 + 0.5);
                    vec2 fw = abs(dCx) + abs(dCy); C = c0;
                    vec2 P = vec2(2.0, 1.0) * uv0 - (r / r.x) * vec2(0.0, 1.0);
                    vec4 O;
                    if (uIsDay > 0.5) { O = vec4(uBgColor, 1.0); }
                    else { O = vec4(uBgColor * 90.0 * uBgGlow / (1e3 * dot(P, P) + 6.0), 0.0); }
                    float mGlow = 0.0;
                    if (uMouseEnabled > 0.5) {
                        vec2 mN = (iMouse + iMouse - r) / r.x; float md = length(uv0 - mN);
                        mGlow = exp(-md * md / max(uMouseRadius * uMouseRadius, 1e-4)) * uMouseStrength;
                        if(uIsDay < 0.5) O.rgb += uMouseColor * mGlow * 0.25; 
                    }
                    float zr = 5e-4 * uStreakWidth; vec2 rr = vec2(max(length(fw), 1e-5)); float tail = 19.0 / max(uStreakLength, 0.05);
                    for (int m = 0; m < 16; m++) {
                        if (m >= uStreakCount) break;
                        float jf = float(m) + 1.0; float ic = fract(sin(dot(vec2(jf, floor(C.x / Y.x + 0.5)), vec2(7.0, 11.0)) * 73.0));
                        vec2 Pp = C - (T + T * ic) * vec2(0.0, 1.0); Pp -= floor(Pp / Y + 0.5) * Y;
                        float h = fract(8663.0 * ic); vec3 col = palette(h);
                        float weight = mix(1.5, 1.0 + sin(T + 7.0 * h + 4.0), uTwinkle) * (1.0 + mGlow * 2.0);
                        vec2 inner = vec2(length(max(Pp, vec2(-1.0, 0.0))), length(Pp) - zr) - zr;
                        vec2 sm = vec2(1.0) - smoothstep(-rr, rr, inner);
                        float streakIntensity = dot(sm, vec2(exp(tail * Pp.y), 3.0)) * weight;
                        if (uIsDay > 0.5) { O.rgb = mix(O.rgb, col, streakIntensity * 0.25); }
                        else { O.rgb += streakIntensity * col; }
                        C.x += Y.x / 8.0;
                    }
                    vec3 colr;
                    if (uIsDay > 0.5) { colr = min(O.rgb, vec3(1.0)); }
                    else { colr = sqrt(tanhv(max(O.rgb * uGlow - vec3(0.04, 0.08, 0.02), 0.0))); }
                    o = vec4(colr, uOpacity);
                }
                void main() { mainImage(gl_FragColor, vUv * iResolution.xy); }
            `,
            uniforms: bgUniforms,
            transparent: true, depthWrite: false, depthTest: false   
        });
        const bgPlane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
        bgScene.add(bgPlane);

        // 【致命修复 2：后期处理目标必须允许写入 Stencil 数据】
        const renderTarget = new THREE.WebGLRenderTarget(
            window.innerWidth,
            window.innerHeight,
            { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, stencilBuffer: true }
        );
        
        const composer = new THREE.EffectComposer(renderer, renderTarget);
        const bgRenderPass = new THREE.RenderPass(bgScene, bgCamera);
        composer.addPass(bgRenderPass);
        
        const modelRenderPass = new THREE.RenderPass(scene, camera);
        modelRenderPass.clear = false; // 需要保持背景图案不被擦除
        
        // 【致命修复 3：拦截底层管线，强行清理上一次残留的深度和模板】
        // 因为 modelRenderPass.clear = false，默认不会清理任何内容，导致我们的 Stencil 越堆越乱
        const originalRender = modelRenderPass.render;
        modelRenderPass.render = function(renderer, writeBuffer, readBuffer, deltaTime, maskActive) {
            renderer.setRenderTarget(this.renderToScreen ? null : readBuffer);
            // 核心：第一个 false 代表不清除颜色(留着背景)，后两个 true 代表强行清除深度和 Stencil 缓冲！
            renderer.clear(false, true, true); 
            originalRender.call(this, renderer, writeBuffer, readBuffer, deltaTime, maskActive);
        };
        composer.addPass(modelRenderPass);

        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 
            0.7, 0.6, 0.82
        );
        composer.addPass(bloomPass);

        // ==========================================
        // 5. 交互控制与光照
        // ==========================================
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.copy(initialTargetPos);
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        controls.minDistance = 5; controls.maxDistance = 150;
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.update();

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.1); scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0xaaccff, 0x334466, 0.7); 
        hemiLight.position.set(0, 50, 0); scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5); 
        dirLight.position.set(30, 50, -30); scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x6688aa, 0.2);
        fillLight.position.set(-20, 20, 30); scene.add(fillLight);

        // ==========================================
        // 6. 地板与网格
        // ==========================================
        const floorW = 32.0; const floorD = 19.0; 
        const floorGeo = new THREE.PlaneGeometry(floorW, floorD);
        const floorMat = new THREE.MeshBasicMaterial({ 
            color: colors.night.floor, transparent: true, opacity: colors.night.floorOpacity 
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2; floorMesh.position.set(0, -0.01, 0); scene.add(floorMesh);

        const gridGeom = new THREE.BufferGeometry(); const gridPts = []; const step = 1.0; 
        for(let i = -floorW/2; i <= floorW/2; i += step) 
            gridPts.push(i, 0, -floorD/2, i, 0, floorD/2);
        for(let i = -floorD/2; i <= floorD/2; i += step) 
            gridPts.push(-floorW/2, 0, i, floorW/2, 0, i);
        gridGeom.setAttribute('position', new THREE.Float32BufferAttribute(gridPts, 3));
        const majorGrid = new THREE.LineSegments(gridGeom, new THREE.LineBasicMaterial({ 
            color: colors.night.grid, transparent: true, opacity: colors.night.gridOpacity 
        }));
        majorGrid.position.set(0, 0.02, 0); scene.add(majorGrid);

        const boundaryEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(floorW, 2, floorD));
        const boundaryMat = new THREE.LineDashedMaterial({ 
            color: 0x00ffff, linewidth: 1, scale: 1, dashSize: 0.5, gapSize: 0.3, transparent: true, opacity: 0.5
        });
        const boundaryMesh = new THREE.LineSegments(boundaryEdges, boundaryMat); 
        boundaryMesh.computeLineDistances(); 
        boundaryMesh.position.set(0, 1, 0); scene.add(boundaryMesh);

        // ==========================================
        // 7.1 安全通道生成 (递增模板魔法，完美防重叠)
        // ==========================================
        const passageGroup = new THREE.Group();
        passageGroup.name = 'SafePassageGroup';
        scene.add(passageGroup);

        // 1. 隐形遮罩层 (负责打底片，将所有通道区域写为 1)
        const maskMat = new THREE.MeshBasicMaterial({
            colorWrite: false, depthWrite: false, transparent: true, opacity: 0,
            stencilWrite: true, stencilRef: 1, 
            stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp
        });

        // 2. 边框层 (改为纯白色)
        const passageBorderMat = new THREE.MeshBasicMaterial({
            color: 0xffffff, // 纯白
            transparent: true, opacity: 0.8, depthWrite: false,
            stencilWrite: true, stencilRef: 1, 
            stencilFunc: THREE.NotEqualStencilFunc, stencilZPass: THREE.KeepStencilOp
        });

        // 3. 通道主体 (改为冰白色，发光调为冷灰)
        const passageBodyMat = new THREE.MeshStandardMaterial({
            color: 0xe0e6ed, // 冰白色
            emissive: 0x445566, // 冷灰色微发光
            emissiveIntensity: 0.8,
            transparent: true, opacity: 0.65, // 透明度微调
            depthWrite: false,
            stencilWrite: true, stencilRef: 1, 
            stencilFunc: THREE.EqualStencilFunc, stencilZPass: THREE.IncrementStencilOp
        });

        // 4. 流光带生成 (将绿色渐变改为白色渐变)
        const flowCanvas = document.createElement('canvas');
        flowCanvas.width = 64; flowCanvas.height = 256;
        const ctx = flowCanvas.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        // 这里的 RGB 改成了 255, 255, 255 (白色)
        grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.6)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 256);
        const flowTex = new THREE.CanvasTexture(flowCanvas);
        flowTex.wrapS = THREE.RepeatWrapping; flowTex.wrapT = THREE.RepeatWrapping;
        
        const flowMat = new THREE.MeshBasicMaterial({
            map: flowTex, color: 0xffffff, // 设为纯白
            transparent: true, opacity: 0.4, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
            stencilWrite: true, stencilRef: 2, 
            stencilFunc: THREE.EqualStencilFunc, stencilZPass: THREE.IncrementStencilOp
        });

        const safePassagesData = [

            { name: 'Box-72', x:  11.3045, y_pos: 0.5, z: -5.7899, w: 1.1667, d: 0.3125, h: 1.0, color: 0x112240, ecolor: 0x33bbff },
            { name: 'Box-73', x: -11.5429, y_pos: 0.5, z:  7.1265, w: 3.9792, d: 1.8333, h: 1.0, color: 0x0d1117, ecolor: 0x33bbff },
            { name: 'Box-74', x:  -8.6783, y_pos: 0.5, z:  7.1767, w: 1.0833, d: 1.7255, h: 1.0, color: 0x172554, ecolor: 0xbc13fe },
            { name: 'Box-75', x:  -8.4179, y_pos: 0.5, z:  6.7306, w: 0.6458, d: 0.7500, h: 1.0, color: 0x0a192f, ecolor: 0x00ffcc },
            { name: 'Box-76', x:  -6.4075, y_pos: 0.5, z:  7.1663, w: 2.8333, d: 1.7463, h: 1.0, color: 0x1a2130, ecolor: 0x00ffff },
            { name: 'Box-77', x:  -2.8704, y_pos: 0.5, z:  6.9750, w: 4.2292, d: 2.1288, h: 1.0, color: 0x0f172a, ecolor: 0x00ffcc },
            { name: 'Box-78', x:   0.4525, y_pos: 0.5, z:  7.1208, w: 2.2500, d: 1.8372, h: 1.0, color: 0x020c1b, ecolor: 0x00ffcc },
            { name: 'Box-79', x:   2.0566, y_pos: 0.5, z:  6.9855, w: 0.7917, d: 2.1080, h: 1.0, color: 0x0d1117, ecolor: 0x00ffff },
            { name: 'Box-80', x:   3.3483, y_pos: 0.5, z:  6.9855, w: 1.8333, d: 2.1080, h: 1.0, color: 0x0d1117, ecolor: 0x00ffff },
            { name: 'Box-81', x:   3.7650, y_pos: 0.5, z:  7.7355, w: 0.9583, d: 0.6080, h: 1.0, color: 0x0f293e, ecolor: 0x00ffcc },
            { name: 'Box-82', x:   4.7441, y_pos: 0.5, z:  7.0063, w: 0.8333, d: 2.0663, h: 1.0, color: 0x0d1117, ecolor: 0x00ffaa },
            { name: 'Box-83', x:   7.5107, y_pos: 0.5, z:  7.0063, w: 4.6875, d: 2.0663, h: 1.0, color: 0x1a2130, ecolor: 0x00ffcc },
            { name: 'Box-101', x: 11.2587, y_pos: 0.5, z: 7.8349, w: 2.7084, d: 0.4091, h: 1.0, color: 0x1a2a4a, ecolor: 0x00ffcc },
            { name: 'Box-84', x:  10.7712, y_pos: 0.5, z:  6.6814, w: 1.8750, d: 1.4980, h: 1.0, color: 0x112240, ecolor: 0xbc13fe },
            { name: 'Box-85', x:  12.2295, y_pos: 0.5, z:  6.6795, w: 0.9583, d: 1.5000, h: 1.0, color: 0x1a2130, ecolor: 0x00ffaa },
            { name: 'Box-86', x:  11.6725, y_pos: 0.5, z: -6.9390, w: 1.9583, d: 0.5833, h: 1.0, color: 0x0d1117, ecolor: 0x33bbff },
            { name: 'Box-87', x:   2.7767, y_pos: 0.5, z: -7.3452, w: 3.7083, d: 1.3958, h: 1.0, color: 0x1e293b, ecolor: 0x33bbff },
            { name: 'Box-88', x: -13.8739, y_pos: 0.5, z: -5.6212, w: 0.6042, d: 1.9583, h: 1.0, color: 0x0f172a, ecolor: 0xbc13fe },
            { name: 'Box-89', x: -13.8426, y_pos: 0.5, z: -2.4025, w: 0.6667, d: 4.4375, h: 1.0, color: 0x0f172a, ecolor: 0xbc13fe },
            { name: 'Box-90', x:  13.8322, y_pos: 0.5, z:  2.7954, w: 0.6875, d: 4.7500, h: 1.0, color: 0x1e293b, ecolor: 0x00ffff },
            { name: 'Box-91', x:  13.8530, y_pos: 0.5, z: -4.2463, w: 0.6458, d: 4.5000, h: 1.0, color: 0x0f172a, ecolor: 0x00ffff }
        ];

        const interactableObjects = []; 
        const baseMaterials = []; 
        const labelsData = []; 
        const boxMap = {}; 

        // 1. 定义安全四色标准调色板
        const SAFETY_COLORS = {
            red:    { base: 0xaa2222, edge: 0xff4444 }, // 红色
            yellow: { base: 0xaa8800, edge: 0xffff33 }, // 黄色
            blue:   { base: 0x1155aa, edge: 0x3399ff }, // 蓝色
            green:  { base: 0x117722, edge: 0x44ff66 }  // 绿色
        };

        // 2. 专属颜色配置表：你想给哪个Box填什么色，直接在这里写！
        // 格式为：'Box名称': '颜色名'
        const customBoxColors = {
            'Box-14': 'red',     // 举例：把 Box-14 涂成红色
            'Box-33': 'yellow',  // 举例：把 Box-33 涂成黄色
            'Box-83': 'blue',    // 举例：把 Box-83 涂成蓝色
            'Box-101': 'green',  // 举例：把 Box-101 涂成绿色
            // 在这里继续添加你需要自定义颜色的 Box...
            // 'Box-50': 'red',
        };

        blocksData.forEach((data, index) => {
            // 3. 颜色分配逻辑：如果在配置表里找到了，就用安全色；没找到，就用它原来的颜色
            const colorTarget = customBoxColors[data.name];
            const theme = (colorTarget && SAFETY_COLORS[colorTarget]) 
                          ? SAFETY_COLORS[colorTarget] 
                          : { base: data.color, edge: data.ecolor };

            // 覆盖当前 box 的颜色数据
            data.color = theme.base;
            data.ecolor = theme.edge;

            const material = new THREE.MeshStandardMaterial({ 
                color: data.color, metalness: 0.5, roughness: 0.65,
                transparent: true, opacity: 0.97, 
                emissive: data.color, emissiveIntensity: 0.45,
                polygonOffset: true, polygonOffsetFactor: -index, polygonOffsetUnits: -index
            });

            // 4. 关键：保留物理缝隙 GAP，防止 Box 挤在一起显示不全
            const GAP = 0.08; 
            const geoW = Math.max(0.1, data.w - GAP);
            const geoD = Math.max(0.1, data.d - GAP);
            
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(geoW, data.h, geoD), material);
            mesh.position.set(data.x, data.y_pos, data.z);
            mesh.userData = { 
                name: data.name, 
                baseColor: data.color, 
                edgeColor: data.ecolor, 
                currentStatus: 'normal', 
                area: geoW * geoD 
            };
            
            scene.add(mesh); 
            interactableObjects.push(mesh); 
            baseMaterials.push(material); 
            boxMap[data.name] = mesh;

            const edgeMat = new THREE.LineBasicMaterial({ 
                color: data.ecolor, linewidth: 1, transparent: true, opacity: 0.85 
            });
            const line = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), edgeMat);
            mesh.add(line); 
            
            const labelDiv = document.createElement('div'); 
            labelDiv.className = 'box-label'; 
            labelDiv.textContent = data.name;
            document.getElementById('labels-container').appendChild(labelDiv);
            labelsData.push({ element: labelDiv, mesh: mesh });
        });

        // ==========================================
        // 8. 鼠标交互与射线检测
        // ==========================================
        const raycaster = new THREE.Raycaster(); 
        const mouse = new THREE.Vector2(); 
        const tooltip = document.getElementById('tooltip');
        let hoveredObject = null; const shaderMouseTarget = [0, 0];

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            shaderMouseTarget[0] = event.clientX * dpr; shaderMouseTarget[1] = (window.innerHeight - event.clientY) * dpr;

            const intersects = raycaster.intersectObjects(interactableObjects);
            if (intersects.length > 0) {
                const topHitDistance = intersects[0].distance;
                const validHits = intersects.filter(hit => Math.abs(hit.distance - topHitDistance) < 0.05);
                validHits.sort((a, b) => a.object.userData.area - b.object.userData.area);
                
                const object = validHits[0].object;
                if (hoveredObject !== object) {
                    if (hoveredObject) restoreObjectColor(hoveredObject);
                    hoveredObject = object;
                    hoveredObject.material.color.setHex(0x00ffff);
                    hoveredObject.material.emissive.setHex(0x0088ff);
                    hoveredObject.material.emissiveIntensity = isDayMode ? 0.3 : 0.6; 
                    if (hoveredObject.children[0]) hoveredObject.children[0].material.color.setHex(0xffffff);
                    tooltip.style.display = 'block'; tooltip.innerText = object.userData.name;
                } 
                tooltip.style.left = (event.clientX + 15) + 'px'; tooltip.style.top  = (event.clientY + 15) + 'px';
            } else {
                if (hoveredObject) { restoreObjectColor(hoveredObject); hoveredObject = null; }
                tooltip.style.display = 'none';
            }
        });

        function restoreObjectColor(mesh) {
            const status = mesh.userData.currentStatus;
            if (mesh.children[0]) mesh.children[0].material.color.setHex(mesh.userData.edgeColor);
            if (status !== 'normal' && STATUS_COLORS[status]) {
                mesh.material.emissive.setHex(STATUS_COLORS[status]);
                mesh.material.color.setHex(STATUS_COLORS[status]);
                mesh.material.emissiveIntensity = isDayMode ? 0.5 : 1.2; 
            } else {
                mesh.material.emissive.setHex(mesh.userData.baseColor);
                mesh.material.color.setHex(mesh.userData.baseColor);
                mesh.material.emissiveIntensity = isDayMode ? 0.0 : 0.45;
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
            bgUniforms.iResolution.value.set(window.innerWidth * dpr, window.innerHeight * dpr, 1);
        }, false);

        // ==========================================
        // 9. UI 控制与昼夜切换
        // ==========================================
        const modeBtn = document.getElementById('mode-toggle');
        modeBtn.addEventListener('click', () => {
            isDayMode = !isDayMode;
            document.body.classList.toggle('light-mode', isDayMode);
            const theme = isDayMode ? colors.day : colors.night;
            
            bgUniforms.uIsDay.value = isDayMode ? 1.0 : 0.0;
            bgUniforms.uBgColor.value = hexToRGB(theme.bgHex);
            
            if (isDayMode) {
                bgUniforms.uColor0.value = hexToRGB(bgConfig.dayColors[0]); bgUniforms.uColor1.value = hexToRGB(bgConfig.dayColors[1]); bgUniforms.uColor2.value = hexToRGB(bgConfig.dayColors[2]);
            } else {
                bgUniforms.uColor0.value = hexToRGB(bgConfig.colors[0]); bgUniforms.uColor1.value = hexToRGB(bgConfig.colors[1]); bgUniforms.uColor2.value = hexToRGB(bgConfig.colors[2]);
            }

            transitionTargets.ambient = isDayMode ? 1.4 : 1.1;
            transitionTargets.hemi = isDayMode ? 0.9 : 0.7;
            transitionTargets.dir = isDayMode ? 0.5 : 0.5;
            transitionTargets.fill = isDayMode ? 0.3 : 0.2;
            transitionTargets.bloom = isDayMode ? 0.0 : 0.7;
            transitionTargets.fogColor.set(theme.fog);
            transitionTargets.floorColor.set(theme.floor);
            transitionTargets.gridColor.set(theme.grid);
            
            arrowMat.color.setHex(isDayMode ? 0x00cc00 : 0x00ff00);

            baseMaterials.forEach(mat => { mat.emissiveIntensity = isDayMode ? 0.0 : 0.45; mat.opacity = isDayMode ? 1.0 : 0.97; });
            interactableObjects.forEach(mesh => {
                mesh.children.forEach(child => { if (child.isLineSegments) child.material.opacity = isDayMode ? 0.7 : 0.85; });
                restoreObjectColor(mesh);
            });
        });

        // 标签显隐切换
        let isLabelsVisible = false;
        document.getElementById('labels-toggle').addEventListener('click', () => {
            isLabelsVisible = !isLabelsVisible;
            labelsData.forEach(item => { item.element.style.display = isLabelsVisible ? 'block' : 'none'; });
        });

        // 视角重置动画逻辑
        const resetBtn = document.getElementById('reset-btn'); 
        let isResetting = false;
        resetBtn.addEventListener('click', () => {
            if(isResetting) return; isResetting = true;
            const duration = 1000; 
            const startPos = camera.position.clone(); 
            const startTarget = controls.target.clone(); 
            const startTime = performance.now();
            function animateReset(time) {
                const elapsed = time - startTime; 
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                camera.position.lerpVectors(startPos, initialCameraPos, easeProgress);
                controls.target.lerpVectors(startTarget, initialTargetPos, easeProgress);
                controls.update();
                if(progress < 1) requestAnimationFrame(animateReset); else isResetting = false;
            }
            requestAnimationFrame(animateReset);
        });

        // ==========================================
        // 11. 主渲染循环
        // ==========================================
        const clock = new THREE.Clock(); 
        let lastTime = 0;
        let initialLoadCleared = false;

        function animate(currentTime) {
            requestAnimationFrame(animate);

            if (!initialLoadCleared) {
                const ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.style.opacity = '0';
                    setTimeout(() => ls.style.display = 'none', 800);
                }
                initialLoadCleared = true;
            }

            if(!isResetting) controls.update(); 
            
            const elapsed = clock.getElapsedTime();
            bgUniforms.iTime.value = elapsed;
            
            const breathe = (Math.sin(elapsed * Math.PI * 4) + 1) / 2; 
            passageBodyMat.emissiveIntensity = 0.6 + breathe * 0.8;
            arrowMat.emissiveIntensity = 0.8 + breathe * 1.2;
            flowTex.offset.y -= 0.015; 
            arrowGroup.children.forEach(arrow => {
                arrow.position.y = 0.04 + Math.sin(elapsed * 2 + arrow.position.x) * 0.005;
            });

            ambientLight.intensity += (transitionTargets.ambient - ambientLight.intensity) * 0.05;
            hemiLight.intensity += (transitionTargets.hemi - hemiLight.intensity) * 0.05;
            dirLight.intensity += (transitionTargets.dir - dirLight.intensity) * 0.05;
            fillLight.intensity += (transitionTargets.fill - fillLight.intensity) * 0.05;
            bloomPass.strength += (transitionTargets.bloom - bloomPass.strength) * 0.05;
            scene.fog.color.lerp(transitionTargets.fogColor, 0.05);
            floorMat.color.lerp(transitionTargets.floorColor, 0.05);
            majorGrid.material.color.lerp(transitionTargets.gridColor, 0.05);
            boundaryMat.color.lerp(transitionTargets.gridColor, 0.05);

            if (lastTime) {
                const dt = (currentTime - lastTime) / 1000;
                let factor = 1 - Math.exp(-dt / 0.15); 
                if (factor > 1) factor = 1;
                bgUniforms.iMouse.value.x += (shaderMouseTarget[0] - bgUniforms.iMouse.value.x) * factor;
                bgUniforms.iMouse.value.y += (shaderMouseTarget[1] - bgUniforms.iMouse.value.y) * factor;
            }
            lastTime = currentTime;
            
            const degrees = controls.getAzimuthalAngle() * (180 / Math.PI) * -1;
            document.getElementById('compass-container').style.transform = `rotate(${degrees}deg)`;
            
            if (isLabelsVisible) {
                labelsData.forEach(item => {
                    const vector = new THREE.Vector3(); 
                    item.mesh.getWorldPosition(vector); 
                    const labelWorldPos = vector.clone();
                    vector.y += 0.8; 
                    labelWorldPos.y += 0.8;
                    vector.project(camera);
                    
                    const dir = labelWorldPos.clone().sub(camera.position).normalize();
                    raycaster.set(camera.position, dir);
                    const hits = raycaster.intersectObjects(interactableObjects);
                    const distanceToLabel = camera.position.distanceTo(labelWorldPos);
                    const blocked = hits.length > 0 && hits[0].object !== item.mesh && hits[0].distance < distanceToLabel;

                    if (vector.z < -1 || vector.z > 1 || Math.abs(vector.x) > 1.2 || Math.abs(vector.y) > 1.2 || blocked) {
                        item.element.style.display = 'none';
                    } else {
                        item.element.style.display = 'block';
                        item.element.style.left = `${(vector.x * .5 + .5) * window.innerWidth}px`;
                        item.element.style.top  = `${(vector.y * -.5 + .5) * window.innerHeight}px`;
                    }
                });
            }
            // 管线已被成功拦截，不需要手动 clearStencil()
            composer.render();
        }
        requestAnimationFrame(animate);
    </script>
